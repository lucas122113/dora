<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="script.js">
</head>
<body>
    <div class="Calculator-card">
        <div class="display-container">
            <div id="history"></div>
            <div id="display">0</div>
        </div>

        <div class="buttons-grid">
                <!--linha 1-->
            <button onclick="clearDisplay()" class="btn btn-clear">AC</button>
            <button onclick="deleteDigit()" class="btn btn-del">DEL</button>
            <button onclick="appendOperator('/')" class="btn btn-operator">/</button>
                <!--linha 2-->
            <button onclick="appendNumber('7')" class="btn">7</button>
            <button onclick="clearDisplay('8')" class="btn">8</button>
            <button onclick="clearDisplay('9')" class="btn">9</button>
            <button onclick="appendOperator('*')" class="btn btn-operator">*</button>
                <!--linha 3-->
            <button onclick="clearDisplay('4')" class="btn">4</button>
            <button onclick="clearDisplay('5')" class="btn">5</button>
            <button onclick="clearDisplay('6')" class="btn">6</button>
            <button onclick="appendOperator('-')" class="btn btn-operator">-</button>
                <!--linha 4-->
            <button onclick="clearDisplay('1')" class="btn">1</button>
            <button onclick="clearDisplay('2')" class="btn">2</button>
            <button onclick="clearDisplay('3')" class="btn">3</button>
            <button onclick="appendOperator('+')" class="btn btn-operator">+</button>
                <!--linha 5-->
            <button onclick="clearDisplay('0')" class="btn">0</button>
            <button onclick="appendOperator('.')" class="btn btn-operator">.</button>
            <button onclick="calculate()" class="btn btn-equal">=</button>
            
        </div>
    </div>
    <script src="script.js"></script>   
</body>
</html>
